server:
  port: 18080

spring:
  application:
    name: linkverse-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:18849}
        namespace: ${NACOS_NAMESPACE:linkverse-mvp}
        group: ${NACOS_GROUP:LINKVERSE_MVP}
        username: ${NACOS_RUNTIME_USERNAME:}
        password: ${NACOS_RUNTIME_PASSWORD:}
        health-indicator:
          enabled: false
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "${LINKVERSE_CORS_ALLOWED_ORIGIN:http://localhost:5173}"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                  - Idempotency-Key
                  - X-Request-Id
                exposed-headers:
                  - X-Request-Id
                allow-credentials: false
                max-age: 3600
          routes:
            - id: identity-route
              uri: lb://linkverse-identity
              predicates:
                - Path=/api/v1/auth/**,/oauth2/**,/.well-known/**
            - id: trade-route
              uri: lb://linkverse-trade
              predicates:
                - Path=/api/v1/listings/**,/api/v1/seckill/**,/api/v1/orders/**,/api/v1/recommendations/**,/api/v1/recommendation-events,/api/v1/cart/**
            - id: payment-route
              uri: lb://linkverse-payment
              predicates:
                - Path=/api/v1/payment-intents/**,/api/v1/mock-provider/**,/api/v1/payments/callbacks/mock

linkverse:
  security:
    issuer-uri: ${LINKVERSE_ISSUER_URI:http://localhost:18080}
    jwk-set-uri: ${LINKVERSE_JWK_SET_URI:http://localhost:18081/oauth2/jwks}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
logging:
  structured:
    format:
      console: logstash

---
spring:
  config:
    activate:
      on-profile: local

logging:
  file:
    name: ${LINKVERSE_LOG_ROOT}/linkverse-gateway/application/application.log
  structured:
    format:
      file: logstash
  logback:
    rollingpolicy:
      file-name-pattern: ${LINKVERSE_LOG_ROOT}/linkverse-gateway/application/archive/application.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 200MB
