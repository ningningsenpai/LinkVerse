server:
  port: 18082

spring:
  application:
    name: linkverse-trade
  datasource:
    url: ${TRADE_DB_URL:jdbc:mysql://localhost:13307/linkverse_mvp_trade?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${TRADE_DB_USERNAME:}
    password: ${TRADE_DB_PASSWORD:}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
  flyway:
    enabled: true
    user: ${TRADE_FLYWAY_USERNAME:}
    password: ${TRADE_FLYWAY_PASSWORD:}
    locations: classpath:db/migration
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16380}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 3s
      client-name: linkverse-trade
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:15674}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:linkverse-mvp}
    connection-timeout: 3s
    requested-heartbeat: 15s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 500ms
          multiplier: 2
          max-interval: 5s
  security:
    oauth2:
      client:
        registration:
          linkverse-payment-client:
            provider: linkverse-identity
            client-id: ${TRADE_OAUTH_CLIENT_ID:linkverse-trade}
            client-secret: ${TRADE_OAUTH_CLIENT_SECRET:}
            client-authentication-method: client_secret_basic
            authorization-grant-type: client_credentials
            scope: payment.internal
          linkverse-recommendation-client:
            provider: linkverse-identity
            client-id: ${RECOMMENDATION_OAUTH_CLIENT_ID:linkverse-trade-recommendation}
            client-secret: ${RECOMMENDATION_OAUTH_CLIENT_SECRET:}
            client-authentication-method: client_secret_basic
            authorization-grant-type: client_credentials
            scope: recommendation.internal
        provider:
          linkverse-identity:
            token-uri: ${IDENTITY_TOKEN_URI:http://linkverse-identity/oauth2/token}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:18849}
        namespace: ${NACOS_NAMESPACE:linkverse-mvp}
        group: ${NACOS_GROUP:LINKVERSE_MVP}
        username: ${NACOS_RUNTIME_USERNAME:}
        password: ${NACOS_RUNTIME_PASSWORD:}
        health-indicator:
          enabled: false

linkverse:
  security:
    issuer-uri: ${LINKVERSE_ISSUER_URI:http://localhost:18080}
    jwk-set-uri: ${LINKVERSE_JWK_SET_URI:http://localhost:18081/oauth2/jwks}
  trade:
    order-payment-timeout: ${TRADE_ORDER_PAYMENT_TIMEOUT:15m}
    payment-base-url: ${PAYMENT_BASE_URL:http://linkverse-payment}
    recommendation-base-url: ${RECOMMENDATION_BASE_URL:http://127.0.0.1:18084}
    recommendation-timeout: ${RECOMMENDATION_TIMEOUT:800ms}
    recommendation-max-concurrent: ${RECOMMENDATION_MAX_CONCURRENT:20}
    recommendation-user-hmac-secret: ${RECOMMENDATION_USER_HMAC_SECRET:}
    seckill:
      redis-prefix: ${TRADE_SECKILL_REDIS_PREFIX:lv:mvp:trade:}
      relay-delay: ${TRADE_SECKILL_RELAY_DELAY:500ms}
      recovery-delay: ${TRADE_SECKILL_RECOVERY_DELAY:2s}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true

resilience4j:
  circuitbreaker:
    instances:
      recommendation:
        sliding-window-type: count_based
        sliding-window-size: 20
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
logging:
  structured:
    format:
      console: logstash

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/local

logging:
  file:
    name: ${LINKVERSE_LOG_ROOT}/linkverse-trade/application/application.log
  structured:
    format:
      file: logstash
  logback:
    rollingpolicy:
      file-name-pattern: ${LINKVERSE_LOG_ROOT}/linkverse-trade/application/archive/application.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 200MB

---
spring:
  config:
    activate:
      on-profile: snapshot-export
  main:
    web-application-type: none
  flyway:
    enabled: false
  datasource:
    username: ${RECOMMENDATION_EXPORT_DB_USER:${TRADE_DB_USER:}}
    password: ${RECOMMENDATION_EXPORT_DB_PASSWORD:${TRADE_DB_PASSWORD:}}
    hikari:
      read-only: true
      maximum-pool-size: 2
  cloud:
    discovery:
      enabled: false
    nacos:
      discovery:
        enabled: false

linkverse:
  trade:
    payment-events-enabled: false
    snapshot-output: ${RECOMMENDATION_SNAPSHOT_OUTPUT:}
