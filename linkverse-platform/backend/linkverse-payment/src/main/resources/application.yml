server:
  port: 18083

spring:
  application:
    name: linkverse-payment
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:mysql://localhost:13307/linkverse_mvp_payment?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${PAYMENT_DB_USERNAME:}
    password: ${PAYMENT_DB_PASSWORD:}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
  flyway:
    enabled: true
    user: ${PAYMENT_FLYWAY_USERNAME:}
    password: ${PAYMENT_FLYWAY_PASSWORD:}
    locations: classpath:db/migration
    validate-migration-naming: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:15674}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:linkverse-mvp}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:18849}
        namespace: ${NACOS_NAMESPACE:linkverse-mvp}
        group: ${NACOS_GROUP:LINKVERSE_MVP}
        username: ${NACOS_RUNTIME_USERNAME:}
        password: ${NACOS_RUNTIME_PASSWORD:}

linkverse:
  security:
    issuer-uri: ${LINKVERSE_ISSUER_URI:http://localhost:18080}
    jwk-set-uri: ${LINKVERSE_JWK_SET_URI:http://localhost:18081/oauth2/jwks}
  payment:
    mock-provider:
      secret: ${PAYMENT_MOCK_HMAC_SECRET:}
      callback-tolerance: ${PAYMENT_MOCK_CALLBACK_TOLERANCE:5m}
    outbox:
      enabled: ${PAYMENT_OUTBOX_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    nacos-discovery:
      enabled: false

logging:
  structured:
    format:
      console: logstash
